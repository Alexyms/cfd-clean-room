name: Code Review

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    # Only review branches in this repository. A pull request from a fork gets
    # no secrets, so the review step would fail on an empty API key anyway;
    # skipping it avoids leaving a red X on a stranger's PR for a job that was
    # never going to run.
    #
    # Manual re-runs go through workflow_dispatch, which requires write access
    # by construction. The issue_comment trigger this replaces did not: any
    # GitHub user can comment on a public repository, so anyone could fire
    # /review and spend the API key.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      # contents: read is load-bearing. It is what stops an instruction hidden
      # in a diff from reaching the code through the review job.
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.inputs.pr }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The full diff. Exclusion of generated data and the size bound happen
        # in review.py (see .github/scripts/review_diff.py), file by file, so
        # the reviewer is told which paths it did not see. A byte cut here
        # dropped every source file behind benchmarks/results.jsonl on PR #13
        # and PR #14 and reported only that "the diff was truncated".
        run: gh pr diff ${{ steps.pr.outputs.number }} > pr_diff.txt

      - name: Get PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view ${{ steps.pr.outputs.number }} --json title,body,headRefName > pr_meta.json

      - name: Gather context documents
        run: |
          mkdir -p review_context
          # Copy project docs the reviewer needs
          cp claude.md review_context/ 2>/dev/null || echo "claude.md not found"
          cp docs/SYSTEM.md review_context/ 2>/dev/null || echo "SYSTEM.md not found"
          cp docs/PROJECT_PLAN.md review_context/ 2>/dev/null || echo "PROJECT_PLAN.md not found"

      - name: Run code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Characters of diff handed to the reviewer, after exclusions.
          REVIEW_DIFF_CHAR_LIMIT: "100000"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python .github/scripts/review.py

      - name: Post acknowledgment on manual trigger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} \
            --body "Review requested. Running analysis..."
