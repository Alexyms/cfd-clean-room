name: Code Review

# One review per pull request, when it opens or leaves draft, posted on the
# pull request as a record rather than a gate. Deliberately not on synchronize:
# the iteration loop runs in a Claude Code context in VS Code, which is the only
# reviewer that can check whether last round's findings were fixed, and a run on
# every push would reproduce the repeated blind rounds this workflow replaced.
#
# Runs on the Claude subscription through CLAUDE_CODE_OAUTH_TOKEN, not a
# metered API key. The policy the review applies is docs/REVIEW_POLICY.md,
# which CLAUDE.md imports; the code-review plugin reads project rules from
# CLAUDE.md, so nothing here has to hand it any context.
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    # Security, carried forward from the workflow this replaces. On a public
    # repository GitHub withholds secrets from runs triggered by fork pull
    # requests, so a fork PR could never authenticate; this guard skips the job
    # rather than leaving a red X on a stranger's PR for a run that was never
    # going to happen. Independently, the action refuses to start unless the
    # triggering actor has write access to the repository and is not a bot, so
    # nobody without push rights can spend the subscription by opening a pull
    # request. Both checks stay: one is GitHub's, one is the action's.
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      # contents: read is load-bearing. The review reads the checkout and
      # posts through the Claude GitHub App; nothing in this job can commit,
      # so an instruction hidden in a diff cannot reach the code through it.
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts the findings on the pull request, one inline
          # comment per issue or one summary comment when there are none.
          # Without it the review goes only to the run log.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Keep this even though the skill's own allowed-tools names the same
          # tool: the action starts the MCP server that posts inline comments
          # only when --allowedTools in claude_args names it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
