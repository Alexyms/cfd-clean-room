name: Code Review

# One review per pull request, when it opens or leaves draft, posted on the
# pull request as a record rather than a gate. Deliberately not on synchronize:
# the iteration loop runs in a Claude Code context in VS Code, which is the only
# reviewer that can check whether last round's findings were fixed, and a run on
# every push would reproduce the repeated blind rounds this workflow replaced.
#
# Runs on the Claude subscription through CLAUDE_CODE_OAUTH_TOKEN, not a
# metered API key. The policy the review applies is docs/REVIEW_POLICY.md,
# which CLAUDE.md imports; the code-review plugin reads project rules from
# CLAUDE.md, so nothing here has to hand it any context.
on:
  pull_request:
    types: [opened, ready_for_review]
  # Manual re-run against an existing pull request. Dispatching a workflow
  # requires write access to the repository by construction, so this path
  # cannot be used to spend the subscription by anyone without push rights.
  # A dispatched run is not a pull_request event: the action (v1.0.232) starts
  # its inline-comment server only for pull request events, so findings cannot
  # be posted inline from here. The no-issues summary, which goes through
  # gh pr comment, can.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: number

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    # Security, carried forward from the workflow this replaces. On a public
    # repository GitHub withholds secrets from runs triggered by fork pull
    # requests, so a fork PR could never authenticate; this guard skips the job
    # rather than leaving a red X on a stranger's PR for a run that was never
    # going to happen. Independently, the action refuses to start unless the
    # triggering actor has write access to the repository and is not a bot, so
    # nobody without push rights can spend the subscription by opening a pull
    # request. Both checks stay: one is GitHub's, one is the action's. A
    # dispatched run has no pull request payload and needs write access anyway.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      # contents: read is load-bearing. The review reads the checkout and
      # posts through the Claude GitHub App; nothing in this job can commit,
      # so an instruction hidden in a diff cannot reach the code through it.
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Pinned to the commit of release v1.0.232 (2026-09-23) rather than the
      # moving v1 tag, so the action, and the Claude Code it installs, change
      # only when this line does.
      - uses: anthropics/claude-code-action@46a42b43239748e5b25771606bf1f551c3b1b517
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Not pinned, and it cannot be from here: the action's documented
          # plugin_marketplaces input takes Git URLs ending in .git and has no
          # ref or commit field, so the code-review plugin is whatever the
          # marketplace's default branch holds on the day of the run. Its last
          # change at the time of writing was db8834ba1d72 (2026-03-12).
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts the findings on the pull request, one inline
          # comment per issue or one summary comment when there are none.
          # Without it the review goes only to the run log. The number comes
          # from the dispatch input when run by hand, from the event otherwise.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}"
          # --model pins the top-level model only. The plugin names the models
          # of its own sub-agents (Haiku for the eligibility check, Sonnet and
          # Opus for the review), and those are not pinned by this file.
          #
          # --allowedTools is the plugin's own declared set, copied from the
          # allowed-tools frontmatter of plugins/code-review/commands/code-review.md
          # and spelled as it spells them. The action starts an MCP server, and
          # permits a Bash command, only when --allowedTools names it, whatever
          # the plugin declares: the gh read commands are how the review sees the
          # pull request, its history and related issues; gh pr comment posts the
          # no-issues summary; the inline-comment tool posts findings. The runs
          # on #29 and #30, with two of the eight allowed, each ended after six
          # turns in about 30 seconds, ran no Opus agent and posted nothing;
          # the missing six are the first thing to rule out. The action's
          # configuration reference shows Bash(...) rules inside --allowedTools,
          # so all eight stay on this one line.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
