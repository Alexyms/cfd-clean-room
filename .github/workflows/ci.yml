name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

      - name: Check system map is current
        run: python scripts/gen_system_map.py --check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ensure test directories exist
        run: mkdir -p tests reports

      - name: Run all tests with coverage
        run: |
          source .venv/bin/activate
          # Exit code 5 = no tests collected (expected pre-Phase 1)
          # Exit code 1 = test failures (should fail CI)
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=json:reports/coverage.json --junitxml=reports/all-results.xml || {
            exit_code=$?
            if [ $exit_code -eq 5 ]; then
              echo "No tests collected yet. Passing."
              exit 0
            fi
            exit $exit_code
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  core:
    name: Build and Test the Core
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bitwise target is the reference on the same machine with the same C
      # library (ADR-017 G, 2026-11-26), so the job records which it ran on.
      - name: Record the runner's image, C library and processor
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          grep PRETTY_NAME /etc/os-release
          ldd --version | head -n 1
          grep -m 1 "model name" /proc/cpuinfo

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The same script builds the core under WSL2 (ADR-017 A): CMake out of
      # source, CTest, then pip install --no-build-isolation ./core.
      - name: Build the core, run CTest and install the binding
        run: |
          source .venv/bin/activate
          CFD_CORE_BUILD="$RUNNER_TEMP/cfd-core" bash scripts/build_core.sh "$(command -v python)"

      # The parity tests skip when _cfdcore cannot be imported; here a missing
      # module is an error instead (CFD_CORE_REQUIRED). NumPy's AVX-512 loops are
      # off, so that its logarithm and powers are the C library's, as the core's
      # are, on every runner (prompt 94; Alex, 2026-11-25). Every parity module
      # is named here, one a line, so that a module added is added to the job.
      - name: Run the parity tests
        env:
          CFD_CORE_REQUIRED: "1"
          NPY_DISABLE_CPU_FEATURES: X86_V4
        run: |
          source .venv/bin/activate
          pytest -v -m parity \
            tests/test_core_parity.py \
            tests/test_core_march.py \
            tests/test_core_momentum.py \
            tests/test_core_pressure.py \
            tests/test_core_turbulence.py \
            tests/test_core_flow.py \
            tests/test_core_backend.py
