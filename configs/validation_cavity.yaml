# VAL-002: Lid-driven cavity at Re = 100.
#
# Square cavity with a moving lid (top wall, u = 1.0 tangential) and
# stationary no-slip walls elsewhere. No pressure outlet; the solver pins
# the pressure. Scored on the true centerlines against the reference tables
# in validation/metrics.py; tests/test_lid_cavity.py names which. Loaded by
# validation/cases.py for tests/test_lid_cavity.py and scripts/benchmark.py.
#
# 40x40 is the grid CI runs. ECR-001 criterion 3 names 80x80, which is
# judged from a harness row, not in CI. Under the error_estimate rule 80x80
# takes about 12800 outer iterations, hence the cap of 20000.

domain:
  width: 1.0
  height: 1.0
  nx: 40
  ny: 40

mesh:
  # Geometric wall clustering per axis. stretch_ratio 1.0 is uniform. Give
  # stretch_ratio or min_wall_spacing, not both; the cell count fixes the other.
  x:
    stretch_ratio: 1.0
  y:
    stretch_ratio: 1.0

fluid:
  density: 1.0
  viscosity: 0.01
  temperature: 293.0

particles:
  density: 1000.0
  sizes: [0.1e-6]
  mean_free_path: 67.0e-9
  boundary_layer_thickness: 1.0e-3
  hepa_reference:
    diameters: [0.1e-6]
    efficiencies: [0.99999]

solver:
  dt: 0.01
  t_end: 1.0
  output_interval: 10
  convergence_tol: 1.0e-6
  max_simple_iter: 20000
  alpha_velocity: 0.5
  alpha_pressure: 0.3
  max_pressure_iter: 5000
  pressure_rtol: 1.0e-8
  # The case says how it is validated (ECR-001 step 8). The tolerances are the
  # defaults, written out. The collocated solver refuses this rule, so the
  # harness and its VAL-002 test run it under velocity_step, set in memory.
  stopping_rule: error_estimate
  iteration_error_tol: 1.0e-6
  mass_imbalance_tol: 1.0e-10

boundaries:
  lid:
    type: velocity_inlet
    location: top
    x_start: 0.0
    x_end: 1.0
    u_velocity: 1.0
    v_velocity: 0.0

obstacles: []

sensors:
  - name: center
    x: 0.5
    y: 0.5

thresholds:
  "0.1e-6": 100.0
