# Clean Room CFD Simulation -- Layout L2: the supply over the left half only
#
# Prompt 56 (ECR-002 step 8, VAL-018's comparative check): the room of
# configs/clean_room_default.yaml with one deliberately poor change, the HEPA
# supply over the left half of the ceiling only (x 0.5 to 4.0 m, keeping the
# default's margin at the wall) at the same total supply flow, so its face
# velocity doubles to 0.9 m/s. Every other key is the default file's, byte for
# byte; the two files differ only in hepa_supply's x_end and velocity. The
# returns state no velocity and share the same remainder as the default room,
# so every outlet's flow is unchanged. Every stated position is a multiple of
# 0.05 m, so 160x60 and 320x120 represent the layout exactly.

domain:
  width: 8.0        # room width, meters
  height: 3.0       # room height, meters
  # 320x120 (2.5 cm cells): the product grid, with 160x60 its coarser check
  # (ECR-002 section 8, step 8's note of 2026-10-10). Every opening, obstacle
  # edge and sensor sits on a multiple of 0.05 m, so both grids put them on
  # cell faces; 200x75 rounded fourteen of them.
  nx: 320           # grid cells in x direction
  ny: 120           # grid cells in y direction

mesh:
  # Geometric wall clustering per axis. stretch_ratio 1.0 is uniform. Give
  # stretch_ratio or min_wall_spacing, not both; the cell count fixes the other.
  x:
    stretch_ratio: 1.0
  y:
    stretch_ratio: 1.0

fluid:
  density: 1.2      # air density, kg/m^3
  viscosity: 1.81e-5  # dynamic viscosity, Pa*s
  temperature: 293.0   # air temperature, K

particles:
  density: 1000.0    # particle material density, kg/m^3
  sizes: [0.1e-6, 0.3e-6, 0.5e-6, 1.0e-6, 5.0e-6]  # diameters, meters
  mean_free_path: 67.0e-9  # mean free path of air, meters
  boundary_layer_thickness: 1.0e-3  # laminar BL thickness for deposition, meters
  hepa_reference:
    diameters: [0.1e-6, 0.3e-6, 0.5e-6, 1.0e-6, 5.0e-6]  # meters
    efficiencies: [0.99999, 0.99970, 0.99990, 0.99999, 0.99999]

solver:
  dt: 0.01           # time step, seconds
  t_end: 60.0        # simulation end time, seconds
  output_interval: 10  # write output every N timesteps
  convergence_tol: 1.0e-6  # velocity-step tolerance; unused under error_estimate
  # The stop (ADR-011 decision 6 of 2026-10-03; ADR-011 G): error_estimate,
  # whose conditions are the iteration error of the velocity and of the eddy
  # viscosity below iteration_error_tol and the continuity readings below
  # mass_imbalance_tol = 1e-4 rho V_min / t_end, V_min the smallest cell
  # volume per metre of depth (0.025 x 0.025 m^2): 1e-4 x 1.2 x 6.25e-4 / 60.
  stopping_rule: error_estimate
  iteration_error_tol: 1.0e-6
  mass_imbalance_tol: 1.25e-9
  # The cap, the sweep count and the pressure tolerance are ADR-012 D's note
  # of 2026-10-09 (Alex, from ECR-002 step 5): ten momentum sweeps per outer
  # iteration, the only count that converged the finer grids; pressure_rtol
  # 1e-4, which reproduced 1e-8's outer count to the iteration with the faces
  # within 4.4e-10 m/s (ADR-013 decision 3 as amended that day); the cap
  # 10,000, since the error-estimate stop came 1.6 to 2.5 times after the
  # velocity-step stop in every converged row. Prompt 48 measured 4,472 outer
  # iterations on this grid (docs/reports/ecr002_step6_variants.md).
  max_simple_iter: 10000
  momentum_sweeps: 10
  pressure_rtol: 1.0e-4
  # alpha_velocity 0.5 is the value every product measurement since step 0 ran
  # at (docs/reports/ecr002_step0_frozen_viscosity.md; prompts 44 to 48).
  alpha_velocity: 0.5      # velocity under-relaxation factor (0, 1]
  alpha_pressure: 0.3      # pressure under-relaxation factor (0, 1]
  max_pressure_iter: 5000  # CG iteration cap per pressure correction
  # multigrid is the default preconditioner since prompt 54 (ADR-013 decision 1
  # as amended 2026-10-14); the key is stated so the file says what it runs.
  pressure_preconditioner: multigrid

transport:
  # ADR-011 I. cfl_number is the Courant number the explicit advection step
  # runs at, at most the limited scheme's stability bound of 1/2. The product
  # case's own Courant number at dt 0.01 is 0.18 (0.45 m/s over 0.025 m);
  # 0.1 is the value the validation cases use and the solver steps at. The
  # steady-state marches of the step 8 measurement ran at 0.4, checked
  # against 0.1 (docs/reports/ecr002_step6_comparative.md, section 5.4).
  cfl_number: 0.1
  advection_scheme: umist   # QUICK bounded by the UMIST limiter; or upwind
  max_diffusion_iter: 200   # Jacobi sweep cap per class per step
  diffusion_tol: 1.0e-8     # implicit diffusion convergence tolerance
  # Sc_t of the turbulent particle diffusivity nu_t / Sc_t (ADR-012 decision 8).
  # The literature spans 0.2 to 1.3; 0.7 is the value ADR-012 F recommends.
  # Read only when the flow solver hands transport an eddy viscosity field.
  turbulent_schmidt: 0.7

# The k-epsilon model (ADR-012; ECR-002 step 6), the keys VAL-016 ran under
# (tests/couette_reference.py) and every product measurement since prompt 46:
# the standard variant (ADR-012 decision 2 as amended 2026-10-15), scalable
# wall functions (decision 3), k and eps advected by upwind (decision 4 as
# amended 2026-10-10), cfl_number 0.25 (0.5 cycles where 0.25 converges;
# ADR-012 C's note of 2026-10-09), alpha_turbulence 0.7, and the CG solves of
# k and eps to 1e-10 within 500 iterations (prompt 51).
turbulence:
  model: k_epsilon
  variant: standard
  wall_treatment: scalable_wall_functions
  cfl_number: 0.25
  advection_scheme: upwind
  alpha_turbulence: 0.7
  max_iter: 500
  tol: 1.0e-10

boundaries:
  hepa_supply:
    type: velocity_inlet
    location: top
    x_start: 0.5
    x_end: 4.0        # the left half of the ceiling only
    velocity: 0.9     # downward, m/s: the default's 0.45 x 7.0 m over 3.5 m
    hepa_filtered: true   # clean supply: no concentration key (ADR-011 E)
    # The inlet turbulence (ADR-012 B's inlet rule): the baseline every product
    # measurement ran at, 5% intensity and a 0.1 m dissipation length, which
    # gives nu_t / nu about 16 at the supply (prompt 46's report, section 5.3).
    turbulence_intensity: 0.05
    dissipation_length: 0.1

  door:
    type: wall
    location: left
    y_start: 0.0
    y_end: 2.1

  # Every outlet is a fixed-flow outlet: the returns and the hood are ducted to
  # fans, so their flows are set, not found by the room (ADR-012 decision 1,
  # amended 2026-10-08; docs/reports/ecr002_step3_outlet_probe.md, arm D0). A
  # pressure outlet's zero-gradient copy cannot close an outlet cell that air
  # enters sideways, and the room's pressure then climbs without end (#61).
  # The returns state no velocity, so they share what the hood leaves of the
  # supply at one face velocity, which balances the room exactly on any mesh.
  floor_return_1:
    type: fixed_flow_outlet
    location: bottom
    x_start: 0.5
    x_end: 1.25

  floor_return_2:
    type: fixed_flow_outlet
    location: bottom
    x_start: 2.4
    x_end: 2.95

  floor_return_3:
    type: fixed_flow_outlet
    location: bottom
    x_start: 4.6
    x_end: 4.9

  floor_return_4:
    type: fixed_flow_outlet
    location: bottom
    x_start: 5.7
    x_end: 6.3

  hood_exhaust:
    type: fixed_flow_outlet
    location: right
    y_start: 0.9
    y_end: 1.8
    velocity: 0.5     # outward, m/s: the hood's fan (ADR-012 decision 1)

obstacles:
  - name: server_rack
    x_start: 1.5
    x_end: 2.3
    y_start: 0.0
    y_end: 2.0

  - name: litho_tool
    x_start: 3.2
    x_end: 4.5
    y_start: 0.0
    y_end: 2.0

  - name: etch_chamber
    x_start: 5.0
    x_end: 5.6
    y_start: 0.0
    y_end: 2.0

  - name: hood_bench
    x_start: 6.4
    x_end: 7.6
    y_start: 0.0
    y_end: 0.9

sensors:
  - name: near_door
    x: 1.0
    y: 1.5

  - name: above_gap_1
    x: 2.7
    y: 2.5

  - name: above_gap_2
    x: 4.8
    y: 2.5

  - name: hood_entry
    x: 6.2
    y: 1.2

# ISO 14644-1 Class 5 limits, particles per cubic meter.
# Keys must be quoted strings to prevent YAML from parsing them as
# floats, which would change the key format (e.g. 0.1e-6 -> 1e-07).
thresholds:
  "0.1e-6": 1.0e+5
  "0.3e-6": 1.02e+4
  "0.5e-6": 3.52e+3
  "1.0e-6": 8.32e+2
  "5.0e-6": 2.93e+1
