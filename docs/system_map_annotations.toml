# Editorial columns of the generated component register in docs/SYSTEM.md.
#
# scripts/gen_system_map.py reads this file and refuses to run if any module
# under src/ lacks an entry, any entry names a module that does not exist, or
# any `serves` identifier is absent from the SYSTEM.md section 2 register.
#
# `responsibility` is one sentence a reader can check against the module.
# `serves` is a declaration of which requirements the module is meant to
# satisfy. It is not evidence that it does; the tests named in the register's
# Verified By column are. Where the mapping is unclear the list is left short
# rather than padded. Empty src/__init__.py has no entry: the generator gives
# a package marker with no code no row.

[modules."src/boundary_registry.py"]
responsibility = "Interprets the configured boundary segments once, answering which condition and prescribed velocity hold at a point on a domain edge, for every boundary imposition layer: the staggered velocity layer today, the Phase 3 concentration layer next."
serves = ["REQ-S12.1"]

[modules."src/boundary_staggered.py"]
responsibility = "Writes Dirichlet normal velocities exactly into the staggered domain-face entries and exposes the tangential wall values, wall distances and pressure outlets as data for the momentum and pressure steps."
serves = ["REQ-S12"]

[modules."src/config.py"]
responsibility = "Loads the YAML configuration into typed dataclasses and rejects missing keys, wrong types and out-of-range values at load time."
serves = ["REQ-C01", "REQ-C02", "REQ-S10", "REQ-A02", "REQ-A03"]

[modules."src/constants.py"]
responsibility = "Holds the physical constants shared by every module so that none of them defines its own copy."
serves = ["REQ-C04"]

[modules."src/mesh.py"]
responsibility = "Builds the structured grid, uniform or geometrically clustered at the walls, with the face, center, width and center-to-center arrays a face-based stencil needs, and classifies each cell as FLUID, SOLID or BOUNDARY."
serves = ["REQ-S11"]

[modules."src/particles.py"]
responsibility = "Computes per-size-class transport properties: Cunningham correction, settling velocity, Brownian diffusion, deposition velocity and HEPA efficiency."
serves = ["REQ-T03", "REQ-T04", "REQ-T09", "REQ-T10"]

[modules."src/staggered.py"]
responsibility = "Defines the staggered (MAC) field layout: shapes and allocation of face-centered u and v and cell-centered p, the face-to-center averaging the solver applies before returning, and FaceVelocities, the read-only face pair the solver exposes and the transport solver advects with."
serves = ["REQ-S07", "REQ-S13"]

[modules."src/pressure.py"]
responsibility = "Assembles the staggered pressure correction equation from the momentum diagonals with the discrete divergence of u* as its right-hand side, solves it by weighted Jacobi iteration, corrects the face velocities and updates the pressure."
serves = ["REQ-S04", "REQ-S08"]

[modules."src/momentum.py"]
responsibility = "Predicts u* and v* on the staggered grid with QUICK advection by deferred correction over an upwind implicit matrix, one under-relaxed Jacobi sweep per call, and returns the diagonal coefficients the pressure correction needs."
serves = ["REQ-S07", "REQ-S09"]

[modules."src/solver_staggered.py"]
responsibility = "Runs steady SIMPLE on the staggered grid as one outer loop over the momentum predictor and the pressure correction, returning cell-centered fields through the harness's callback shape; stops by the velocity-step rule or, when configured, by the error-estimate rule."
serves = ["REQ-S01", "REQ-S02", "REQ-S03", "REQ-S04", "REQ-S05", "REQ-S07"]

[modules."src/stopping.py"]
responsibility = "Decides when the steady outer iteration has converged, on four conditions: (a) the iteration error estimated from the step and its fitted geometric rate, over a physical velocity scale; (b) the worst per-cell mass imbalance against its own tolerance; (c) the summed imbalance over the through-flow, which shares the tolerance of (a); and (d) the signed imbalance summed over the domain, which shares the tolerance of (b). Also defines IterationState, the snapshot a solver hands its callback once per outer iteration."
serves = ["REQ-S01", "REQ-S04"]
