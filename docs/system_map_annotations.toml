# Editorial columns of the generated component register in docs/SYSTEM.md.
#
# scripts/gen_system_map.py reads this file and refuses to run if any module
# under src/ lacks an entry, any entry names a module that does not exist, or
# any `serves` identifier is absent from the SYSTEM.md section 2 register.
#
# `responsibility` is one sentence a reader can check against the module.
# `serves` is a declaration of which requirements the module is meant to
# satisfy. It is not evidence that it does; the tests named in the register's
# Verified By column are. Where the mapping is unclear the list is left short
# rather than padded. Empty src/__init__.py has no entry: the generator gives
# a package marker with no code no row.

[modules."src/boundary_concentration.py"]
responsibility = "Derives the per-face concentration conditions of each particle class from the registry's shared coverage and ParticlePhysics: the concentration an inlet carries, the deposition velocity and surface code at every wall and obstacle face, and the mask of faces that carry the settling increment, as read-only face-shaped data for the transport solver."
serves = ["REQ-S12.1", "REQ-T09", "REQ-T10"]

[modules."src/boundary_registry.py"]
responsibility = "Interprets the configured boundary segments once, answering which segment covers each point along a domain edge and which condition and prescribed velocity hold there, SOLID cells read as walls, for both boundary imposition layers: the staggered velocity layer and the concentration layer."
serves = ["REQ-S12.1"]

[modules."src/boundary_staggered.py"]
responsibility = "Writes Dirichlet normal velocities exactly into the staggered domain-face entries and exposes the tangential wall values, wall distances and pressure outlets as data for the momentum and pressure steps."
serves = ["REQ-S12"]

[modules."src/config.py"]
responsibility = "Loads the YAML configuration into typed dataclasses and rejects missing keys, wrong types and out-of-range values at load time."
serves = ["REQ-C01", "REQ-C02", "REQ-S10", "REQ-A02", "REQ-A03"]

[modules."src/constants.py"]
responsibility = "Holds the physical constants shared by every module so that none of them defines its own copy."
serves = ["REQ-C04"]

[modules."src/mesh.py"]
responsibility = "Builds the structured grid, uniform or geometrically clustered at the walls, with the face, center, width and center-to-center arrays a face-based stencil needs, and classifies each cell as FLUID, SOLID or BOUNDARY."
serves = ["REQ-S11"]

[modules."src/particles.py"]
responsibility = "Computes per-size-class transport properties: Cunningham correction, settling velocity, Brownian diffusion, deposition velocity and HEPA efficiency."
serves = ["REQ-T03", "REQ-T04", "REQ-T09", "REQ-T10"]

[modules."src/staggered.py"]
responsibility = "Defines the staggered (MAC) field layout: shapes and allocation of face-centered u and v and cell-centered p, the face-to-center averaging the solver applies before returning, and FaceVelocities, the read-only face pair the solver exposes and the transport solver advects with."
serves = ["REQ-S07", "REQ-S13"]

[modules."src/pressure.py"]
responsibility = "Assembles the staggered pressure correction equation from the momentum diagonals with the discrete divergence of u* as its right-hand side, solves it by conjugate gradients preconditioned with its diagonal to a relative residual, a rounding floor or a reported iteration cap, corrects the face velocities and updates the pressure."
serves = ["REQ-S04", "REQ-S08"]

[modules."src/momentum.py"]
responsibility = "Predicts u* and v* on the staggered grid with QUICK advection by deferred correction over an upwind implicit matrix, a configured number of under-relaxed Jacobi sweeps per call, an optional per-cell viscosity field with its face rule and stress source, and the domain edge's wall stencil at obstacle faces, and returns the diagonal coefficients the pressure correction needs."
serves = ["REQ-S07", "REQ-S09", "REQ-S14"]

[modules."src/scalar_scheme.py"]
responsibility = "Holds the cell-centred scalar scheme the transport solver and the k-epsilon model share: QUICK's face value bounded by the UMIST limiter, the advective flux along one axis with the inflow value or the upwind cell at a domain face, and the backward Euler solve of diffusion with a non-negative cell sink by Jacobi, on per-face conductances with one step or a step per cell, with an optional mask of cells held at their value."
serves = ["REQ-T12", "REQ-S15"]

[modules."src/solver_staggered.py"]
responsibility = "Runs steady SIMPLE on the staggered grid as one outer loop over the momentum predictor and the pressure correction, returning cell-centered fields through the harness's callback shape and exposing the final faces as FaceVelocities; stops by the velocity-step rule or, when configured, by the error-estimate rule."
serves = ["REQ-S01", "REQ-S02", "REQ-S03", "REQ-S04", "REQ-S05", "REQ-S07", "REQ-S13", "REQ-S14"]

[modules."src/solver_transport.py"]
responsibility = "Advances one particle class one explicit step on the staggered face velocities: QUICK's face value bounded by the UMIST limiter under forward Euler at a Courant number the configuration sets, implicit diffusion and deposition by Jacobi on per-face conductances, the Brownian coefficient plus nu_t / Sc_t on interior faces when handed an eddy viscosity field, the settling increment on interior faces, sources added and booked, SOLID cells zero; keeps one MassBudget per class and defines FieldHistory, the output contract for the animation."
serves = ["REQ-T01", "REQ-T03", "REQ-T04", "REQ-T05", "REQ-T06", "REQ-T07", "REQ-T08", "REQ-T11", "REQ-T12", "REQ-T13", "REQ-N01"]

[modules."src/stopping.py"]
responsibility = "Decides when the steady outer iteration has converged, on four conditions: (a) the iteration error estimated from the step and its fitted geometric rate, over a physical velocity scale; (b) the worst per-cell mass imbalance against its own tolerance; (c) the summed imbalance over the through-flow, which shares the tolerance of (a); and (d) the signed imbalance summed over the domain, which shares the tolerance of (b). Also defines IterationState, the snapshot a solver hands its callback once per outer iteration."
serves = ["REQ-S01", "REQ-S04"]

[modules."src/turbulence.py"]
responsibility = "Advances the k-epsilon model's k and eps one step on a prescribed face velocity field, standard or RNG with each variant's constants as module data: advection, explicit growth from the strain the faces give and implicit decay and diffusion through the shared scalar scheme, boundary values from a conditions object the caller builds each step, the kinematic eddy viscosity, and an assertion that k and eps are positive and finite after every step."
serves = ["REQ-S14", "REQ-S15"]
